<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Арикси</title>
  
  <!-- Подключаем CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ГЛАВНАЯ КАРТОЧКА -->
  <div class="main-card">
    <div class="avatar">А</div>
    <div class="name">Арикси</div>

    <a href="https://www.tiktok.com/@ar1xy.kz" target="_blank" class="main-btn btn-tiktok">
      <img src="images/tiktok.png" alt="TikTok" /> TikTok
    </a>

    <button class="main-btn btn-projects" onclick="openModal('projectsModal')">
      <img src="images/telegram.png" alt="Telegram" /> Telegram проекты
    </button>

    <button class="main-btn btn-functions" onclick="openModal('functionsModal')">
      <img src="images/tools.png" alt="Инструменты" /> Инструменты
    </button>

    <div class="footer">by <span>Арикси</span></div>
  </div>

  <!-- МОДАЛКА: ПРОЕКТЫ -->
  <div class="modal-overlay" id="projectsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>📁 Проекты</h2>
        <button class="modal-close" onclick="closeModal('projectsModal')">✕</button>
      </div>

      <div class="project-item">
        <div class="project-info">
          <div class="project-logo"><img src="images/rtp-logo.png" alt="Rtp Tun" /></div>
          <h3>Rtp Tun | Kirby</h3>
        </div>
        <a href="https://t.me/RtpTunKirby" target="_blank" class="project-link">Перейти</a>
      </div>

      <div class="project-item">
        <div class="project-info">
          <div class="project-logo"><img src="images/codavrix-logo.png" alt="Codavrix" /></div>
          <h3>Форум Codavrix</h3>
        </div>
        <a href="https://t.me/codavrix_forum" target="_blank" class="project-link">Перейти</a>
      </div>

      <div class="project-item">
        <div class="project-info">
          <div class="project-logo"><img src="images/deathnote-logo.png" alt="DeathNote" /></div>
          <h3>DeathNote_ar1xy</h3>
        </div>
        <a href="https://t.me/DeathNote_ar1xy" target="_blank" class="project-link">Перейти</a>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА: ИНСТРУМЕНТЫ -->
  <div class="modal-overlay" id="functionsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>🛠 Инструменты</h2>
        <button class="modal-close" onclick="closeModal('functionsModal')">✕</button>
      </div>
      <a href="https://t.me/djskejfb" target="_blank" class="key-btn">
        🔑 Бесплатный ключ Rtp Tun
      </a>
    </div>
  </div>

  <!-- Подключаем JavaScript -->
  <script src="js/script.js"></script>
</body>
</html>
