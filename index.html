<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Арикси</title>
  <style>
    /* ===== БАЗА ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-image: 
        linear-gradient(rgba(255,215,0,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,215,0,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    
    .main-card {
      max-width: 420px;
      width: 100%;
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px 28px 30px;
      border: 1px solid rgba(255,215,0,0.08);
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      text-align: center;
      animation: fadeIn 0.5s ease;
    }
    
    /* ===== АВАТАР ===== */
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 16px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(255,215,0,0.15);
      animation: glow 3s ease-in-out infinite;
    }
    
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.1); }
      50% { box-shadow: 0 0 50px rgba(255,215,0,0.3); }
    }
    
    .name {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 28px;
    }
    
    /* ===== КНОПКИ ===== */
    .main-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: none;
      border-radius: 12px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    
    .main-btn:active { transform: scale(0.97); }
    
    .main-btn img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    
    .btn-tiktok {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
    }
    
    .btn-tiktok:hover {
      background: rgba(255,255,255,0.08);
      transform: translateY(-2px);
    }
    
    .btn-projects {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
    }
    
    .btn-projects:hover {
      background: rgba(255,255,255,0.08);
      transform: translateY(-2px);
    }
    
    .btn-functions {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #0a0a0f;
      font-weight: 700;
      box-shadow: 0 4px 30px rgba(255,215,0,0.15);
    }
    
    .btn-functions:hover {
      box-shadow: 0 6px 40px rgba(255,215,0,0.3);
      transform: translateY(-2px);
    }
    
    /* ===== МОДАЛКИ ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.2s ease;
    }
    
    .modal {
      background: #12121a;
      border-radius: 20px;
      max-width: 400px;
      width: 100%;
      padding: 28px 24px;
      border: 1px solid rgba(255,215,0,0.06);
      box-shadow: 0 40px 80px rgba(0,0,0,0.9);
      animation: slideUp 0.2s ease;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .modal-header h2 {
      color: #ffd700;
      font-size: 20px;
      letter-spacing: 0.5px;
    }
    
    .modal-close {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .modal-close:hover {
      background: rgba(255,255,255,0.08);
    }
    
    /* ===== ПРОЕКТЫ ===== */
    .project-item {
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.04);
    }
    
    .project-info {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    
    .project-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: rgba(255,215,0,0.08);
    }
    
    .project-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .project-info h3 {
      color: #fff;
      font-size: 15px;
    }
    
    .project-link {
      background: rgba(255,215,0,0.1);
      color: #ffd700;
      padding: 6px 14px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: 0.15s;
      font-family: 'Courier New', monospace;
    }
    
    .project-link:hover {
      background: rgba(255,215,0,0.2);
    }
    
    /* ===== КЛЮЧ ===== */
    .key-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      border: none;
      border-radius: 12px;
      color: #0a0a0f;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 4px 30px rgba(255,215,0,0.1);
    }
    
    .key-btn:hover {
      box-shadow: 0 6px 40px rgba(255,215,0,0.25);
      transform: translateY(-2px);
    }
    
    .footer {
      color: #333;
      font-size: 12px;
      margin-top: 28px;
      letter-spacing: 0.5px;
    }
    
    .footer span {
      color: #ffd700;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .modal::-webkit-scrollbar { width: 3px; }
    .modal::-webkit-scrollbar-track { background: transparent; }
    .modal::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
  </style>
</head>
<body>
  <!-- ГЛАВНАЯ КАРТОЧКА -->
  <div class="main-card">
    <!-- 1. Аватарка -->
    <div class="avatar">
      <img src="images/avatar.jpg" alt="Арикси">
    </div>
    
    <div class="name">Арикси</div>
    
    <!-- 2. Лого TikTok -->
    <a href="https://www.tiktok.com/@ar1xy.kz" target="_blank" class="main-btn btn-tiktok">
      <img src="images/tiktok.png" alt="TikTok">
      TikTok
    </a>
    
    <!-- 3. Лого Telegram -->
    <button class="main-btn btn-projects" onclick="openModal('projectsModal')">
      <img src="images/telegram.png" alt="Telegram">
      Telegram проекты
    </button>
    
    <!-- 4. Лого Инструменты -->
    <button class="main-btn btn-functions" onclick="openModal('functionsModal')">
      <img src="images/tools.png" alt="Инструменты">
      Инструменты
    </button>
    
    <div class="footer">by <span>Арикси</span></div>
  </div>

  <!-- МОДАЛКА: ПРОЕКТЫ -->
  <div class="modal-overlay" id="projectsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>📁 Проекты</h2>
        <button class="modal-close" onclick="closeModal('projectsModal')">✕</button>
      </div>
      
      <!-- 5. Лого Rtp Tun | Kirby -->
      <div class="project-item">
        <div class="project-info">
          <div class="project-logo">
            <img src="images/rtp-logo.png" alt="Rtp Tun">
          </div>
          <h3>Rtp Tun | Kirby</h3>
        </div>
        <a href="https://t.me/RtpTunKirby" target="_blank" class="project-link">Перейти</a>
      </div>
      
      <!-- 6. Лого Форум Codavrix -->
      <div class="project-item">
        <div class="project-info">
          <div class="project-logo">
            <img src="images/codavrix-logo.png" alt="Codavrix">
          </div>
          <h3>Форум Codavrix</h3>
        </div>
        <a href="https://t.me/codavrix_forum" target="_blank" class="project-link">Перейти</a>
      </div>
      
      <!-- 7. Лого DeathNote -->
      <div class="project-item">
        <div class="project-info">
          <div class="project-logo">
            <img src="images/deathnote-logo.png" alt="DeathNote">
          </div>
          <h3>DeathNote_ar1xy</h3>
        </div>
        <a href="https://t.me/DeathNote_ar1xy" target="_blank" class="project-link">Перейти</a>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА: ИНСТРУМЕНТЫ -->
  <div class="modal-overlay" id="functionsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>🛠 Инструменты</h2>
        <button class="modal-close" onclick="closeModal('functionsModal')">✕</button>
      </div>
      
      <a href="https://t.me/djskejfb" target="_blank" class="key-btn">
        🔑 Бесплатный ключ Rtp Tun
      </a>
    </div>
  </div>

  <script>
    function openModal(id) {
      document.getElementById(id).classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
      document.body.style.overflow = '';
    }
    
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', function(e) {
        if (e.target === this) {
          this.classList.remove('active');
          document.body.style.overflow = '';
        }
      });
    });
    
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay.active').forEach(modal => {
          modal.classList.remove('active');
          document.body.style.overflow = '';
        });
      }
    });
  </script>
</body>
</html>
